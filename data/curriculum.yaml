- group: Web & Code
  goal_id: track-markdown
  tracks:
    - id: track-markdown
      name: Markdown 101
      title: "Markdown 101 — Plain-Text Mastery"
      match_prefix: "markdown-101-"
      phases:
        - label: "Phase 1 (01–04)"
          title: "Core Syntax & Media"
        - label: "Phase 2 (05–08)"
          title: "YAML, Tables & Hugo"
        - label: "Phase 3 (09–10)"
          title: "Obsidian & Capstone"

    - id: track-html
      name: HTML
      title: "HTML5 — Semantic Web Structure"
      match_series: "HTML"
      phases:
        - label: "Phase 1"
          title: "Tags, Forms & Semantics"
        - label: "Phase 2"
          title: "Accessibility & SEO"
        - label: "Phase 3"
          title: "Clean Static Templates"

    - id: track-css
      name: CSS
      title: "Modern CSS — Grid, Flex & Tokens"
      match_series: "CSS"
      phases:
        - label: "Phase 1"
          title: "Box Model & Variables"
        - label: "Phase 2"
          title: "Flexbox & CSS Grid"
        - label: "Phase 3"
          title: "Responsive & Dark Mode"

    - id: track-js
      name: JavaScript
      title: "Vanilla JS — Zero-Bloat Interactivity"
      match_series: "JavaScript"
      phases:
        - label: "Phase 1"
          title: "DOM & Events"
        - label: "Phase 2"
          title: "Fetch, JSON & Storage"
        - label: "Phase 3"
          title: "Client-Side Tools"

    - id: track-python
      name: Python
      title: "Python — CLI & Content Automation"
      match_series: "Python"
      phases:
        - label: "Phase 1"
          title: "Files, YAML & Regex"
        - label: "Phase 2"
          title: "Git & Build Scripts"
        - label: "Phase 3"
          title: "RSS & AI Pipelines"

- group: PKM & Notes
  goal_id: track-obsidian
  tracks:
    - id: track-obsidian
      name: Obsidian
      title: "Obsidian — Plain-Text Second Brain"
      match_prefix: "serein-obsidian"
      phases:
        - label: "Phase 1"
          title: "Vault Structure & Daily Notes"
        - label: "Phase 2"
          title: "Properties, Tags & Bases"
        - label: "Phase 3"
          title: "Publish Vault to Hugo"

    - id: track-notion
      name: Notion
      title: "Notion — Databases & Workflows"
      match_series: "Notion"
      phases:
        - label: "Phase 1"
          title: "Pages & Relations"
        - label: "Phase 2"
          title: "Templates & Dashboards"
        - label: "Phase 3"
          title: "Export & Automation"

- group: Workspace & Publish
  goal_id: track-serein
  tracks:
    - id: track-serein
      name: Serein Workspace
      title: "Serein Calm Workspace"
      match_prefix: "serein-"
      phases:
        - label: "Step 1"
          title: "Theme Philosophy"
        - label: "Step 2"
          title: "VS Code & Neovim"
        - label: "Step 3"
          title: "Obsidian Second Brain"

    - id: track-publish
      name: Hugo & GitHub
      title: "Hugo & GitHub Pages — Zero-Cost Publishing"
      match_prefix: "tao-github-profile"
      phases:
        - label: "Step 1"
          title: "Profile & Repo Setup"
        - label: "Step 2"
          title: "Hugo Config & Layouts"
        - label: "Step 3"
          title: "GitHub Actions Deploy"

- group: Standalone
  goal_id: track-standalone
  tracks:
    - id: track-standalone
      name: Standalone Guides
      title: "Standalone Practical Guides"
      match_standalone: true
      phases:
        - label: "Pick Any"
          title: "No Prerequisites"
        - label: "Follow Along"
          title: "Copy-Paste Configs"
        - label: "Deploy"
          title: "Live in Minutes"
