{{- $lang := site.Language.Lang -}}
{{- $catalog := index site.Data.products $lang -}}
{{- range $catalog.sections -}}
<section class="home-section">
  <div class="section-head">
    <h2 class="section-label"><span aria-hidden="true">// </span>{{ .heading }}</h2>
  </div>
  <div class="featured-grid">
    {{- range .items -}}
    {{- $isExternal := hasPrefix .url "http" -}}
    <a class="hud-card" href="{{ .url }}"{{ if $isExternal }} target="_blank" rel="noopener noreferrer"{{ end }}>
      <div class="hud-card-top">
        <span class="product-badge">{{ .badge }}</span>
        <span class="hud-card-arrow" aria-hidden="true">↗</span>
      </div>
      <h3 class="hud-card-title">{{ .name }}</h3>
      <p class="hud-card-desc">{{ .description }}</p>
      <div class="product-cta">{{ .cta }}</div>
    </a>
    {{- end -}}
  </div>
</section>
{{- end -}}
