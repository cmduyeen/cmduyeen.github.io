{{- with site.Data.repos -}}
<ul class="compact-list">
  {{- range . -}}
  <li>
    <a class="tool-row-name" href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
    {{ with .description }}<span class="tool-row-sep">—</span> <span class="tool-row-desc">{{ . }}</span>{{ end }}
  </li>
  {{- end -}}
</ul>
{{- end -}}
