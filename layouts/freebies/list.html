{{ define "main" }}
  <header class="page-header">
    <h1 class="hero-h1"><span class="highlight">//</span> {{ .Title }}</h1>
    <p class="archive-subtitle">{{ .Description }}</p>
  </header>

  <div class="archive-filter-bar" role="group" aria-label="Filter freebies">
    <button type="button" class="filter-chip is-active" data-deal-filter="all">All</button>
    <button type="button" class="filter-chip" data-deal-filter="Software">Software</button>
    <button type="button" class="filter-chip" data-deal-filter="PC Games">PC Games</button>
    <button type="button" class="filter-chip" data-deal-filter="Dev Perks">Dev Perks</button>
  </div>

  <div class="featured-grid" id="deals-grid">
    {{ range site.Data.freebies }}
    <a class="hud-card deal-card" data-deal-category="{{ .category }}" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
      <div class="hud-card-top">
        <span class="product-badge">{{ .status }} · {{ .platform }}</span>
        <span class="hud-card-arrow" aria-hidden="true">↗</span>
      </div>
      <h2 class="hud-card-title">{{ .name }}</h2>
      <p class="hud-card-desc">{{ .summary }}</p>
      <div class="product-cta">{{ .cta }} →</div>
    </a>
    {{ end }}
  </div>
{{ end }}
