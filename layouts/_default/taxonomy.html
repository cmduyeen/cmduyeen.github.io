{{ define "main" }}
  <header class="page-header">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="{{ "tags/" | relLangURL }}">{{ T "topics" }}</a>
      <span aria-hidden="true">/</span>
      <span>#{{ .Title }}</span>
    </nav>
    <h1 class="hero-h1"><span class="highlight">#</span>{{ .Title }}</h1>
    <p class="archive-subtitle">{{ len .Pages }} {{ T "posts_unit" }}</p>
  </header>
  <ul class="writing-list">
    {{ range .Pages.ByDate.Reverse }}
    {{ partial "post-list-item.html" . }}
    {{ end }}
  </ul>
{{ end }}
