{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="writing-list">
    {{ range .Data.Terms.Alphabetical }}
    <li>
      <a class="writing-item" href="{{ .Page.RelPermalink }}">
        <time>{{ .Count }}</time>
        <span>#{{ .Page.LinkTitle }}</span>
      </a>
    </li>
    {{ end }}
  </ul>
{{ end }}
