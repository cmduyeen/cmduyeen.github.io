{{ define "main" }}
  <header class="page-header">
    <h1 class="hero-h1">{{ .Title }}</h1>
  </header>
  <ul class="compact-list">
    {{ range .Data.Terms.ByCount }}
    <li>
      <a class="tool-row-name" href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }}</a>
      <span class="writing-meta">({{ .Count }})</span>
    </li>
    {{ end }}
  </ul>
{{ end }}
