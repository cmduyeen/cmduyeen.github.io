{{ define "main" }}
  <header class="page-header">
    <h1 class="hero-h1"><span class="highlight">//</span> {{ .Title }}</h1>
    <p class="archive-subtitle">{{ len .Data.Terms }} active topics</p>
  </header>
  <div class="term-grid">
    {{ range .Data.Terms.ByCount }}
    <a class="hud-card term-card" href="{{ .Page.RelPermalink }}">
      <span class="term-name">#{{ .Page.LinkTitle }}</span>
      <span class="term-count">{{ .Count }}</span>
    </a>
    {{ end }}
  </div>
{{ end }}
