{{ define "main" }}
  <header class="page-header">
    <h1 class="hero-h1"><span class="highlight">//</span> {{ .Title }}</h1>
    {{ with .Description }}<p class="archive-subtitle">{{ . }}</p>{{ end }}
  </header>
  <ul class="writing-list">
    {{ range .RegularPages.ByDate.Reverse }}
    {{ partial "post-list-item.html" . }}
    {{ end }}
  </ul>
{{ end }}
